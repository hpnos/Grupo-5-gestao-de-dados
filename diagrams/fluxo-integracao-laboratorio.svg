<svg viewBox="0 0 760 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="O pedido nasce no mesmo commit e viaja sempre com a mesma chave" font-size="12" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="seq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><rect width="760" height="660" fill="#ffffff"/><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">O pedido nasce no mesmo commit e viaja sempre com a mesma chave</text><g id="vida-api"><rect x="36.0" y="56" width="120" height="32" rx="8" fill="#2f6feb" fill-opacity="0.08" stroke="#2f6feb" stroke-width="1.5"/><text x="96" y="77" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">API SVP</text><path d="M96 88 L96 640" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-dasharray="5 4"/></g><g id="vida-pg"><rect x="186.0" y="56" width="120" height="32" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="246" y="77" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">PostgreSQL</text><path d="M246 88 L246 640" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-dasharray="5 4"/></g><g id="vida-worker"><rect x="336.0" y="56" width="120" height="32" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="396" y="77" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">Worker</text><path d="M396 88 L396 640" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-dasharray="5 4"/></g><g id="vida-lab"><rect x="490.0" y="56" width="120" height="32" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="550" y="77" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">Laboratório</text><path d="M550 88 L550 640" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-dasharray="5 4"/></g><g id="vida-obj"><rect x="625.0" y="56" width="110" height="32" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="680" y="77" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">Object storage</text><path d="M680 88 L680 640" fill="none" stroke="#d0d7de" stroke-width="1.25" stroke-dasharray="5 4"/></g><g id="passo1"><rect x="24" y="98" width="168" height="57" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1"/><text x="32" y="117" font-size="11" fill="#1f2328">1  confere o perfil, se o</text><text x="32" y="132" font-size="11" fill="#1f2328">pedido está COLETADO e</text><text x="32" y="147" font-size="11" fill="#1f2328">se há consentimento</text></g><path d="M96 180 L242 180" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#seq-arrow)"/><text x="104" y="173" font-size="11.5" fill="#1f2328">2  INSERT no outbox</text><path d="M396 220 L250 220" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#seq-arrow)"/><text x="254" y="213" font-size="11.5" fill="#1f2328">3  pega lote (lease)</text><path d="M396 260 L546 260" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#seq-arrow)"/><text x="404" y="253" font-size="11.5" fill="#1f2328">4  POST /pedidos + chave</text><path d="M550 300 L400 300" fill="none" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#seq-arrow)"/><text x="404" y="293" font-size="11.5" fill="#1f2328">5  201 + protocolo</text><g id="erro"><rect x="404" y="310" width="138" height="40" rx="6" fill="#f6f8fa" stroke="#cf222e" stroke-width="1"/><text x="412" y="326" font-size="11" fill="#1f2328">503 ou timeout: ERRO,</text><text x="412" y="341" font-size="11" fill="#1f2328">tenta de novo depois</text></g><path d="M396 380 L250 380" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#seq-arrow)"/><text x="254" y="373" font-size="11.5" fill="#1f2328">6  ENVIADO + protocolo</text><path d="M550 422 L100 422" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#seq-arrow)"/><text x="104" y="415" font-size="11.5" fill="#1f2328">7  webhook: HMAC + timestamp + chave</text><g id="passo8"><rect x="24" y="434" width="168" height="72" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1"/><text x="32" y="453" font-size="11" fill="#1f2328">8  confere assinatura,</text><text x="32" y="468" font-size="11" fill="#1f2328">chave, formato,</text><text x="32" y="483" font-size="11" fill="#1f2328">protocolo, versão</text><text x="32" y="498" font-size="11" fill="#1f2328">e SHA-256 do laudo</text></g><path d="M96 530 L676 530" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#seq-arrow)"/><text x="104" y="523" font-size="11.5" fill="#1f2328">9  grava o laudo; o nome do arquivo é o SHA-256</text><path d="M96 570 L242 570" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#seq-arrow)"/><text x="104" y="563" font-size="11.5" fill="#1f2328">10  CONCLUIDO + inbox</text><path d="M96 610 L546 610" fill="none" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#seq-arrow)"/><text x="104" y="603" font-size="11.5" fill="#1f2328">11  200: processado, duplicado ou versão antiga</text></svg>