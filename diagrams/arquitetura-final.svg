<svg viewBox="0 0 760 776" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cada dado fica onde é mais útil e mais protegido" font-size="12" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><rect width="760" height="776" fill="#ffffff"/><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">Cada dado fica onde é mais útil e mais protegido</text><text x="24" y="50" font-size="11.5" fill="#57606a">Arquitetura de dados do SVP; as siglas marcam onde está cada entrega</text><text x="24" y="80" font-size="10.5" font-weight="600" fill="#57606a">USUÁRIOS E PARCEIROS</text><g id="equipe"><rect x="24" y="90" width="154" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="36" y="114" font-size="13" font-weight="600" fill="#1f2328">Equipe da clínica</text><text x="36" y="130" font-size="11.5" fill="#57606a">navegador e app</text></g><g id="parceiros"><rect x="202" y="90" width="332" height="80" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="214" y="112" font-size="13" font-weight="600" fill="#1f2328">Parceiros externos</text><rect x="488" y="98" width="36" height="18" rx="9" fill="#2f6feb" fill-opacity="0.15" stroke="#2f6feb" stroke-width="1"/><text x="506" y="111" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2328">INT</text><rect x="214" y="124" width="148" height="34" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="288" y="145" font-size="12.5" text-anchor="middle" fill="#1f2328">Laboratório</text><rect x="374" y="124" width="148" height="34" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="448" y="145" font-size="12.5" text-anchor="middle" fill="#1f2328">Pagamento · NFS-e</text></g><g id="diretoria"><rect x="558" y="90" width="154" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="570" y="114" font-size="13" font-weight="600" fill="#1f2328">Diretoria</text><text x="570" y="130" font-size="11.5" fill="#57606a">painel de indicadores</text></g><g id="fronteira-tls"><path d="M24 206 L712 206" fill="none" stroke="#cf222e" stroke-width="1.25" stroke-dasharray="5 4"/><text x="486" y="199" font-size="11.5" fill="#57606a">fronteira HTTPS/TLS e firewall</text><rect x="676" y="186" width="36" height="18" rx="9" fill="#cf222e" fill-opacity="0.15" stroke="#cf222e" stroke-width="1"/><text x="694" y="199" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2328">SEC</text></g><text x="24" y="246" font-size="10.5" font-weight="600" fill="#57606a">APLICAÇÃO</text><g id="api"><rect x="24" y="256" width="332" height="116" rx="8" fill="#2f6feb" fill-opacity="0.08" stroke="#2f6feb" stroke-width="2"/><text x="36" y="280" font-size="13" font-weight="600" fill="#1f2328">API SVP (FastAPI)</text><rect x="36" y="290" width="36" height="18" rx="9" fill="#cf222e" fill-opacity="0.15" stroke="#cf222e" stroke-width="1"/><text x="54" y="303" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2328">SEC</text><rect x="78" y="290" width="36" height="18" rx="9" fill="#2f6feb" fill-opacity="0.15" stroke="#2f6feb" stroke-width="1"/><text x="96" y="303" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2328">INT</text><text x="36" y="324" font-size="11.5" fill="#57606a">login Argon2id + MFA, sessão revogável</text><text x="36" y="340" font-size="11.5" fill="#57606a">RBAC: 7 perfis, permissão por recurso e ação</text><text x="36" y="356" font-size="11.5" fill="#57606a">registra leituras, alterações e acessos negados</text></g><g id="worker"><rect x="380" y="256" width="154" height="116" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="392" y="280" font-size="13" font-weight="600" fill="#1f2328">Worker (outbox)</text><rect x="392" y="290" width="36" height="18" rx="9" fill="#2f6feb" fill-opacity="0.15" stroke="#2f6feb" stroke-width="1"/><text x="410" y="303" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2328">INT</text><text x="392" y="324" font-size="11.5" fill="#57606a">fila no PostgreSQL</text><text x="392" y="340" font-size="11.5" fill="#57606a">retentativa 30 s a 1 h</text><text x="392" y="356" font-size="11.5" fill="#57606a">mesma chave no reenvio</text></g><g id="cofre"><rect x="558" y="256" width="154" height="116" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="570" y="280" font-size="13" font-weight="600" fill="#1f2328">Cofre de segredos</text><rect x="570" y="290" width="36" height="18" rx="9" fill="#cf222e" fill-opacity="0.15" stroke="#cf222e" stroke-width="1"/><text x="588" y="303" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2328">SEC</text><text x="570" y="324" font-size="11.5" fill="#57606a">senhas dos papéis</text><text x="570" y="340" font-size="11.5" fill="#57606a">tokens e chaves</text><text x="570" y="356" font-size="11.5" fill="#57606a">nada no código</text></g><text x="24" y="396" font-size="10.5" font-weight="600" fill="#57606a">DADOS</text><g id="postgres"><rect x="24" y="406" width="154" height="116" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="36" y="430" font-size="13" font-weight="600" fill="#1f2328">PostgreSQL 16</text><rect x="36" y="440" width="36" height="18" rx="9" fill="#8250df" fill-opacity="0.15" stroke="#8250df" stroke-width="1"/><text x="54" y="453" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2328">MOD</text><rect x="78" y="440" width="36" height="18" rx="9" fill="#1a7f37" fill-opacity="0.15" stroke="#1a7f37" stroke-width="1"/><text x="96" y="453" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2328">STO</text><text x="36" y="474" font-size="11.5" fill="#57606a">46 tabelas, 3FN</text><text x="36" y="490" font-size="11.5" fill="#57606a">log particionado</text><text x="36" y="506" font-size="11.5" fill="#57606a">regras no banco</text></g><g id="objetos"><rect x="202" y="406" width="154" height="116" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="214" y="430" font-size="13" font-weight="600" fill="#1f2328">Object storage</text><rect x="214" y="440" width="36" height="18" rx="9" fill="#1a7f37" fill-opacity="0.15" stroke="#1a7f37" stroke-width="1"/><text x="232" y="453" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2328">STO</text><rect x="256" y="440" width="36" height="18" rx="9" fill="#cf222e" fill-opacity="0.15" stroke="#cf222e" stroke-width="1"/><text x="274" y="453" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2328">SEC</text><text x="214" y="474" font-size="11.5" fill="#57606a">laudos e imagens</text><text x="214" y="490" font-size="11.5" fill="#57606a">cifrado, versionado</text><text x="214" y="506" font-size="11.5" fill="#57606a">nome = SHA-256</text></g><g id="replica"><rect x="380" y="406" width="154" height="116" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="392" y="430" font-size="13" font-weight="600" fill="#1f2328">Réplica (leitura)</text><rect x="392" y="440" width="36" height="18" rx="9" fill="#1a7f37" fill-opacity="0.15" stroke="#1a7f37" stroke-width="1"/><text x="410" y="453" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2328">STO</text><text x="392" y="474" font-size="11.5" fill="#57606a">outra zona</text><text x="392" y="490" font-size="11.5" fill="#57606a">assume se o primário</text><text x="392" y="506" font-size="11.5" fill="#57606a">cair; fonte do ETL</text></g><text x="202" y="576" font-size="10.5" font-weight="600" fill="#57606a">ANÁLISE E CÓPIAS</text><g id="backup"><rect x="24" y="586" width="154" height="100" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="36" y="610" font-size="13" font-weight="600" fill="#1f2328">Backups</text><rect x="36" y="620" width="36" height="18" rx="9" fill="#1a7f37" fill-opacity="0.15" stroke="#1a7f37" stroke-width="1"/><text x="54" y="633" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2328">STO</text><rect x="78" y="620" width="36" height="18" rx="9" fill="#cf222e" fill-opacity="0.15" stroke="#cf222e" stroke-width="1"/><text x="96" y="633" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2328">SEC</text><text x="36" y="654" font-size="11.5" fill="#57606a">banco: PITR + diário</text><text x="36" y="670" font-size="11.5" fill="#57606a">arquivos: versões</text></g><g id="etl"><rect x="380" y="586" width="154" height="100" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="392" y="610" font-size="13" font-weight="600" fill="#1f2328">ETL noturno</text><rect x="392" y="620" width="36" height="18" rx="9" fill="#2f6feb" fill-opacity="0.15" stroke="#2f6feb" stroke-width="1"/><text x="410" y="633" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2328">INT</text><rect x="434" y="620" width="36" height="18" rx="9" fill="#cf222e" fill-opacity="0.15" stroke="#cf222e" stroke-width="1"/><text x="452" y="633" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2328">SEC</text><text x="392" y="654" font-size="11.5" fill="#57606a">ids com HMAC</text><text x="392" y="670" font-size="11.5" fill="#57606a">janela de 90 dias</text></g><g id="dw"><rect x="558" y="586" width="154" height="100" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="570" y="610" font-size="13" font-weight="600" fill="#1f2328">Data warehouse</text><rect x="570" y="620" width="36" height="18" rx="9" fill="#8250df" fill-opacity="0.15" stroke="#8250df" stroke-width="1"/><text x="588" y="633" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2328">MOD</text><rect x="612" y="620" width="36" height="18" rx="9" fill="#1a7f37" fill-opacity="0.15" stroke="#1a7f37" stroke-width="1"/><text x="630" y="633" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2328">STO</text><text x="570" y="654" font-size="11.5" fill="#57606a">modelo estrela</text><text x="570" y="670" font-size="11.5" fill="#57606a">sem dado do tutor</text></g><g id="conexoes"><path d="M101 146 L101 256" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arq-arrow)"/><path d="M300 170 L300 256" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arq-arrow)"/><path d="M457 256 L457 170" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arq-arrow)"/><path d="M558 314 L534 314" fill="none" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#arq-arrow)"/><path d="M101 372 L101 406" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arq-arrow)"/><path d="M279 372 L279 406" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arq-arrow)"/><path d="M140 522 L140 548 L410 548 L410 522" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arq-arrow)"/><path d="M70 522 L70 586" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arq-arrow)"/><path d="M500 522 L500 586" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arq-arrow)"/><path d="M534 636 L558 636" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arq-arrow)"/><path d="M712 636 L736 636 L736 120 L712 120" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arq-arrow)"/></g><text x="306" y="240" font-size="11" fill="#57606a">webhooks</text><text x="463" y="240" font-size="11" fill="#57606a">pedidos</text><text x="275" y="542" font-size="11" text-anchor="middle" fill="#57606a">replicação contínua</text><g id="legenda"><rect x="24" y="706" width="36" height="18" rx="9" fill="#bf8700" fill-opacity="0.15" stroke="#bf8700" stroke-width="1"/><text x="42" y="719" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2328">ARQ</text><text x="66" y="719" font-size="11.5" fill="#1f2328">Data Architecture: o desenho todo, com camadas, componentes e fluxos</text>